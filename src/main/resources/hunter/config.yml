# WSMP-Hunter configuration
# Points are an in-plugin currency earned from tasks and Legendary Requests —
# NOT real money, NOT shared with any other plugin.
# Every number in this file is a placeholder ratio; rebalance to taste.
#
# MOB TIER PLACEMENT: the design doc lists several mobs across multiple tiers
# (e.g. Witch, Ravager, Shulker appear at more than one tier as a "tougher"
# version). Vanilla mobs don't actually scale in difficulty by world day the
# way that implies, and each mob can only belong to one tier here (the same
# architecture constraint as every other WSMP skill plugin). Warden/Wither/
# Ender Dragon are kept exclusively at Tier 7 as the doc's explicit "boss
# task" trio; every other mob is assigned to roughly the tier band it fits
# best. One real gap this created: once duplicates are removed, the doc's own
# Tier 6 list is empty (every mob in it is a repeat from Tier 4/5, and "Raid"/
# "Bastion Encounter"/"End City Encounter" aren't real EntityType values, so
# they can't be tracked via EntityDeathEvent at all). Elder Guardian and
# Shulker were moved down from the doc's Tier 5 to fill Tier 6 instead, since
# both are already the toughest non-boss mobs the doc lists and both require
# real exploration (ocean monument / End city) to even find — a reasonable
# fit for "Elite" that doesn't require inventing new content.
#
# ANTI-CHEESE: kills only count toward a task if your held weapon and worn
# chestplate meet that tier's minimum material rank (see EquipmentConditions
# in code) — Tier 3+ requires Stone/Leather, Tier 4+ Iron, Tier 5+ Diamond,
# Tier 6-7 Netherite. This is what stops AFK/undergeared farming.
#
# HOMES SYSTEM DROPPED: the doc's 3-home system (with per-home unlock costs
# and cooldowns) was simplified to just "Teleport to Combat Master" — matching
# the same simplification already made across Mining/Woodcutting/Farming/
# Fishing/Cooking, for consistency across the whole plugin set.

settings:
  skip-cost: 25.0
  task-block-cost: 100.0
  master-teleport-cost: 1500.0
  master-teleport-cooldown-minutes: 30
  guide-book-cooldown-hours: 24
  npc-shop-radius: 5.0

